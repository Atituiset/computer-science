[book]
title = "Computer Science Notes"
authors = ["atituiset"]
description = "Personal CS knowledge base — DSA, OS, Networks, DB, Compilers, Distributed Systems, System Design, Computer Architecture, Computation Theory, Cryptography, Information Theory"
language = "zh"
src = "."

[build]
build-dir = "book"
create-missing = false

[preprocessor.alerts]
enabled = true

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
smart-punctuation = false
mathjax-support = false
additional-css = ["katex/katex.min.css"]
additional-js = ["katex/katex.min.js", "katex/contrib/auto-render.min.js", "katex-init.js", "mermaid.min.js", "mermaid-init.js", "notes.js"]

[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = true
use-boolean-and = true
boost-title = 2
boost-paragraph = 1
boost-hierarchy = 1
