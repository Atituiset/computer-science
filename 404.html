aCha20\",\"link\":\"/crypto/symmetric.md\"},{\"text\":\"2. 操作模式: ECB / CBC / CTR / GCM (AEAD) 与 nonce-reuse 灾难\",\"link\":\"/crypto/modes.md\"},{\"text\":\"3. 非对称加密: RSA 与 ECC\",\"link\":\"/crypto/asymmetric.md\"},{\"text\":\"4. 密钥交换: DH / ECDHE / X25519\",\"link\":\"/crypto/key-exchange.md\"},{\"text\":\"5. 数字签名: RSA-PSS / ECDSA / Ed25519\",\"link\":\"/crypto/signatures.md\"},{\"text\":\"6. 哈希: SHA-256 / SHA-3 / BLAKE3 / 抗碰撞史\",\"link\":\"/crypto/hashes.md\"},{\"text\":\"7. TLS 1.3 握手全流程\",\"link\":\"/crypto/tls13.md\"},{\"text\":\"8. 证书链: X.509 / PKI / Certificate Transparency / OCSP\",\"link\":\"/crypto/pki.md\"},{\"text\":\"9. ZKP 入门: zk-SNARKs / zk-STARKs / Bulletproofs\",\"link\":\"/crypto/zkp.md\"},{\"text\":\"10. 侧信道攻击: timing / power analysis / Spectre / Meltdown\",\"link\":\"/crypto/sidechannel.md\"},{\"text\":\"11. 安全最佳实践: constant-time / nonce 不重用 / 密钥轮转\",\"link\":\"/crypto/best-practices.md\"},{\"text\":\"附录: 密码学考试 / 工程 checklist\",\"link\":\"/crypto/appendix.md\"}],\"collapsed\":false},{\"text\":\"第十一部分 · 信息论与编码\",\"items\":[{\"text\":\"开篇：从 Shannon 1948 到 5G NR 编解码设计\",\"link\":\"/info-theory/\"},{\"text\":\"1. Shannon Entropy: 离散源熵 / 联合熵 / 条件熵 / 互信息\",\"link\":\"/info-theory/entropy.md\"},{\"text\":\"2. 信道容量: 香农公式 C = B · log₂(1 + SNR)\",\"link\":\"/info-theory/capacity.md\"},{\"text\":\"3. 无损压缩: 哈夫曼 / LZ77 / LZ78 / zstd / 算术编码 / ANS\",\"link\":\"/info-theory/compression.md\"},{\"text\":\"4. 汉明码: 可纠 1-bit 错误的鼻祖\",\"link\":\"/info-theory/hamming.md\"},{\"text\":\"5. Reed-Solomon 在 GF(2⁸) 上的纠错码\",\"link\":\"/info-theory/reed-solomon.md\"},{\"text\":\"6. BCH 码、循环码与多项式基础\",\"link\":\"/info-theory/bch.md\"},{\"text\":\"7. LDPC 码: 5G NR 数据信道与 Tanner 图\",\"link\":\"/info-theory/ldpc.md\"},{\"text\":\"8. Polar 码: Arikan 2008 构造与 5G NR 控制信道\",\"link\":\"/info-theory/polar.md\"},{\"text\":\"9. Turbo 码: 3G/4G 并行级联卷积码与 BCJR 迭代\",\"link\":\"/info-theory/turbo.md\"},{\"text\":\"10. 调制: QPSK / 16-QAM / 64-QAM 星座图与误码率\",\"link\":\"/info-theory/modulation.md\"},{\"t
